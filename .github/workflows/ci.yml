name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: coverage run manage.py test

      - name: Enforce coverage threshold
        run: coverage report --fail-under=80

      - name: Write coverage XML
        if: always()
        run: coverage xml -o coverage.xml

      - name: Check formatting
        run: black --check .

      - name: Run Flake8
        run: flake8 accounts config courses documents meetings notifications manage.py

      - name: Run Bandit
        run: bandit -r accounts config courses documents meetings notifications -ll -x '*/tests/*,*/test_*.py,*/migrations/*'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
