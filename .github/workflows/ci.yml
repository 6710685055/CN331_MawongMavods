name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: coverage run manage.py test

      - name: Enforce coverage threshold
        run: coverage report --fail-under=80

      - name: Add coverage to job summary
        if: always()
        run: |
          echo "## Test coverage" >> "$GITHUB_STEP_SUMMARY"
          if [ -f .coverage ]; then
            coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage data was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Write coverage XML
        if: always()
        run: coverage xml -o coverage.xml

      - name: Write HTML coverage report
        if: always()
        run: coverage html -d htmlcov

      - name: Check formatting
        run: black --check .

      - name: Run Flake8
        run: flake8 accounts config courses documents meetings notifications manage.py

      - name: Run Bandit
        run: bandit -r accounts config courses documents meetings notifications -ll -x '*/tests/*,*/test_*.py,*/migrations/*'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  # Production on Render uses PostgreSQL, so run the suite against it too.
  postgres-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cn331
          POSTGRES_PASSWORD: cn331
          POSTGRES_DB: cn331
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cn331"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cn331:cn331@localhost:5432/cn331
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run migrations on PostgreSQL
        run: python manage.py migrate --no-input

      - name: Run tests on PostgreSQL
        run: python manage.py test
