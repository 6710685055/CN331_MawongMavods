{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<div style="display:flex; justify-content:center; padding-top:2rem;">
  <div class="card" style="width:100%; max-width:420px;">
    <div style="text-align:center; margin-bottom:1.25rem;">
      <div style="width:48px; height:48px; border-radius:12px; background:linear-gradient(135deg,var(--brand-dark),#a78bfa); display:inline-grid; place-items:center; margin-bottom:.75rem;">
        <i data-lucide="log-in" style="width:22px;height:22px;color:#fff;"></i>
      </div>
      <h1 style="justify-content:center;">เข้าสู่ระบบ</h1>
      <p class="help" style="margin-top:-.5rem;">เข้าสู่ระบบเพื่อจัดการรายวิชาและเอกสาร</p>
    </div>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="actions" style="margin-top:1.25rem;">
        <button type="submit" style="width:100%;">
          <i data-lucide="arrow-right" style="width:16px;height:16px;"></i>
          เข้าสู่ระบบ
        </button>
      </div>
    </form>
    <div style="margin-top:1.25rem; padding-top:1rem; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:.5rem .85rem; justify-content:center; font-size:.85rem;">
      <a href="{% url 'accounts:password_reset' %}">ลืมรหัสผ่าน?</a>
      <a href="{% url 'accounts:resend_verification' %}">ส่งอีเมลยืนยันอีกครั้ง</a>
      <a href="{% url 'accounts:register' %}">สมัครสมาชิก</a>
    </div>
  </div>
</div>
{% endblock %}
