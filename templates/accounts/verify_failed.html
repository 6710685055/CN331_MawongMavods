{% extends "base.html" %}
{% block title %}ลิงก์ยืนยันใช้ไม่ได้{% endblock %}
{% block content %}
<div style="display:flex; justify-content:center; padding-top:2rem;">
  <div class="card" style="width:100%; max-width:420px; text-align:center;">
    <div style="width:56px; height:56px; border-radius:14px; background:linear-gradient(135deg,#dc2626,#f87171); display:inline-grid; place-items:center; margin-bottom:1rem;">
      <i data-lucide="link-2-off" style="width:26px;height:26px;color:#fff;"></i>
    </div>
    <h1 style="justify-content:center;">ลิงก์ยืนยันใช้ไม่ได้</h1>
    <p>ลิงก์นี้ไม่ถูกต้องหรือหมดอายุแล้ว<br>ขอลิงก์ใหม่ได้จากปุ่มด้านล่าง</p>
    <div class="actions" style="justify-content:center;">
      <a class="btn" href="{% url 'accounts:resend_verification' %}">
        <i data-lucide="refresh-cw" style="width:15px;height:15px;"></i>
        ส่งอีเมลยืนยันอีกครั้ง
      </a>
    </div>
  </div>
</div>
{% endblock %}
