{% extends "base.html" %}
{% block title %}ตั้งรหัสผ่านใหม่{% endblock %}
{% block content %}
<div class="card">
  {% if validlink %}
    <h1>ตั้งรหัสผ่านใหม่</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form.html" %}
      <div class="actions"><button type="submit">บันทึกรหัสผ่านใหม่</button></div>
    </form>
  {% else %}
    <h1>ลิงก์ใช้ไม่ได้</h1>
    <p>ลิงก์นี้ไม่ถูกต้องหรือถูกใช้ไปแล้ว</p>
    <div class="actions"><a class="btn" href="{% url 'accounts:password_reset' %}">ขอลิงก์ใหม่</a></div>
  {% endif %}
</div>
{% endblock %}
