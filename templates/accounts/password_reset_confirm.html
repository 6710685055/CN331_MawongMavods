{% extends "base.html" %}
{% block title %}ตั้งรหัสผ่านใหม่{% endblock %}
{% block content %}
<div style="display:flex; justify-content:center; padding-top:2rem;">
  <div class="card" style="width:100%; max-width:420px;">
    {% if validlink %}
      <div style="text-align:center; margin-bottom:1.25rem;">
        <div style="width:48px; height:48px; border-radius:12px; background:linear-gradient(135deg,var(--brand-dark),#a78bfa); display:inline-grid; place-items:center; margin-bottom:.75rem;">
          <i data-lucide="lock" style="width:22px;height:22px;color:#fff;"></i>
        </div>
        <h1 style="justify-content:center;">ตั้งรหัสผ่านใหม่</h1>
      </div>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "partials/form.html" %}
        <div class="actions" style="margin-top:1.25rem;">
          <button type="submit" style="width:100%;">
            <i data-lucide="save" style="width:15px;height:15px;"></i>
            บันทึกรหัสผ่านใหม่
          </button>
        </div>
      </form>
    {% else %}
      <div style="text-align:center;">
        <div style="width:56px; height:56px; border-radius:14px; background:linear-gradient(135deg,#dc2626,#f87171); display:inline-grid; place-items:center; margin-bottom:1rem;">
          <i data-lucide="link-2-off" style="width:26px;height:26px;color:#fff;"></i>
        </div>
        <h1 style="justify-content:center;">ลิงก์ใช้ไม่ได้</h1>
        <p>ลิงก์นี้ไม่ถูกต้องหรือถูกใช้ไปแล้ว</p>
        <div class="actions" style="justify-content:center;">
          <a class="btn" href="{% url 'accounts:password_reset' %}">
            <i data-lucide="refresh-cw" style="width:15px;height:15px;"></i>
            ขอลิงก์ใหม่
          </a>
        </div>
      </div>
    {% endif %}
  </div>
</div>
{% endblock %}
