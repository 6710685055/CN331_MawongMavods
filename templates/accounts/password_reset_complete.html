{% extends "base.html" %}
{% block title %}เปลี่ยนรหัสผ่านแล้ว{% endblock %}
{% block content %}
<div style="display:flex; justify-content:center; padding-top:2rem;">
  <div class="card" style="width:100%; max-width:420px; text-align:center;">
    <div style="width:56px; height:56px; border-radius:14px; background:linear-gradient(135deg,#059669,#34d399); display:inline-grid; place-items:center; margin-bottom:1rem;">
      <i data-lucide="check-circle" style="width:26px;height:26px;color:#fff;"></i>
    </div>
    <h1 style="justify-content:center;">เปลี่ยนรหัสผ่านเรียบร้อยแล้ว</h1>
    <div class="actions" style="justify-content:center; margin-top:1.25rem;">
      <a class="btn" href="{% url 'accounts:login' %}">
        <i data-lucide="log-in" style="width:15px;height:15px;"></i>
        เข้าสู่ระบบ
      </a>
    </div>
  </div>
</div>
{% endblock %}
