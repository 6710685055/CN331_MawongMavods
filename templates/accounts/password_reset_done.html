{% extends "base.html" %}
{% block title %}ส่งลิงก์แล้ว{% endblock %}
{% block content %}
<div style="display:flex; justify-content:center; padding-top:2rem;">
  <div class="card" style="width:100%; max-width:420px; text-align:center;">
    <div style="width:56px; height:56px; border-radius:14px; background:linear-gradient(135deg,#059669,#34d399); display:inline-grid; place-items:center; margin-bottom:1rem;">
      <i data-lucide="mail-check" style="width:26px;height:26px;color:#fff;"></i>
    </div>
    <h1 style="justify-content:center;">ตรวจสอบอีเมลของคุณ</h1>
    <p>ถ้าอีเมลนี้มีบัญชีอยู่ เราได้ส่งลิงก์ตั้งรหัสผ่านใหม่ไปให้แล้ว</p>
    <div style="margin-top:1.25rem; padding-top:1rem; border-top:1px solid var(--border);">
      <a href="{% url 'accounts:login' %}">
        <i data-lucide="arrow-left" style="width:13px;height:13px;vertical-align:middle;"></i>
        กลับไปหน้าเข้าสู่ระบบ
      </a>
    </div>
  </div>
</div>
{% endblock %}
