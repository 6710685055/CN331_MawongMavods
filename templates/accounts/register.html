{% extends "base.html" %}
{% block title %}สมัครสมาชิก{% endblock %}
{% block content %}
<div class="card">
  <h1>สมัครสมาชิก</h1>
  <p class="help">ใช้อีเมลอะไรก็ได้ ไม่จำกัดมหาวิทยาลัย เราจะส่งลิงก์ยืนยันไปให้</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "partials/form.html" %}
    <div class="actions">
      <button type="submit">สมัครสมาชิก</button>
      <a href="{% url 'accounts:login' %}">มีบัญชีแล้ว? เข้าสู่ระบบ</a>
    </div>
  </form>
</div>
{% endblock %}
