{% extends "base.html" %}
{% block title %}สมัครสมาชิก{% endblock %}
{% block content %}
<div style="display:flex; justify-content:center; padding-top:2rem;">
  <div class="card" style="width:100%; max-width:420px;">
    <div style="text-align:center; margin-bottom:1.25rem;">
      <div style="width:48px; height:48px; border-radius:12px; background:linear-gradient(135deg,#059669,#34d399); display:inline-grid; place-items:center; margin-bottom:.75rem;">
        <i data-lucide="user-plus" style="width:22px;height:22px;color:#fff;"></i>
      </div>
      <h1 style="justify-content:center;">สมัครสมาชิก</h1>
      <p class="help" style="margin-top:-.5rem;">ใช้อีเมลอะไรก็ได้ ไม่จำกัดมหาวิทยาลัย เราจะส่งลิงก์ยืนยันไปให้</p>
    </div>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form.html" %}
      <div class="actions" style="margin-top:1.25rem;">
        <button type="submit" class="btn success" style="width:100%;">
          <i data-lucide="check-circle" style="width:16px;height:16px;"></i>
          สมัครสมาชิก
        </button>
      </div>
    </form>
    <div style="margin-top:1.25rem; padding-top:1rem; border-top:1px solid var(--border); text-align:center; font-size:.85rem;">
      <span style="color:var(--text-muted);">มีบัญชีแล้ว?</span>
      <a href="{% url 'accounts:login' %}">เข้าสู่ระบบ</a>
    </div>
  </div>
</div>
{% endblock %}
