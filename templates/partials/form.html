{% for error in form.non_field_errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}
{% for field in form %}
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<p class="help">{{ field.help_text|safe }}</p>{% endif %}
  {% for error in field.errors %}<p class="field-error" role="alert">{{ error }}</p>{% endfor %}
{% endfor %}
