# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
databases:
  - name: cn331-db
    plan: free
    databaseName: cn331
    user: cn331

services:
  - type: web
    name: cn331-mawongmavods
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: cn331-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: ENABLE_MEETING_REMINDER_LOOP
        value: "1"
      # Filled in on the dashboard when the Blueprint is created.
      - key: BREVO_API_KEY
        sync: false
      - key: DJANGO_DEFAULT_FROM_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_FIRST_NAME
        sync: false
      - key: DJANGO_SUPERUSER_LAST_NAME
        sync: false
